[project]
name = "job-copilot-backend"
version = "0.1.0"
description = "Job Copilot — copiloto de postulaciones con IA (FastAPI + SQLAlchemy)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-multipart>=0.0.12",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
